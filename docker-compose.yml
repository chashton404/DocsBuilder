services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - docsbuilder-data:/data
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  docsbuilder-data:
